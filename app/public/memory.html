<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yaadein — Memory Inspector</title>
<style>
  :root { --ink:#1e2033; --soft:#6b7092; --paper:#f5f5f3; --line:#dedee0; --indigo:#4f46e5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif; background:var(--paper); color:var(--ink); }
  .wrap { max-width:60rem; margin:0 auto; padding:2rem 1.25rem 4rem; }
  h1 { font-family:Georgia,serif; font-size:1.6rem; margin:0; }
  .sub { color:var(--soft); font-size:0.85rem; margin:0.3rem 0 1.5rem; }
  .people { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.5rem; }
  .person { border:1px solid var(--line); background:#fff; border-radius:999px; padding:0.5rem 1.1rem; cursor:pointer; font-size:0.9rem; }
  .person.active { background:var(--indigo); color:#fff; border-color:var(--indigo); }
  .loop { border-left:3px solid var(--indigo); background:#eef0ff; padding:0.7rem 1rem; border-radius:4px; font-size:0.9rem; margin-bottom:1rem; }
  .mem { background:#fff; border:1px solid var(--line); border-radius:8px; padding:0.9rem 1.1rem; margin-bottom:0.6rem; }
  .row { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.4rem; }
  .chip { font-family:ui-monospace,monospace; font-size:0.62rem; letter-spacing:0.06em; padding:0.15rem 0.5rem; border-radius:3px; font-weight:600; }
  .USER_STATED { background:#e4efe8; color:#2f6b4f; }
  .USER_CONFIRMED { background:#f5ebda; color:#8a5a12; }
  .USER_ELABORATED { background:#e0f2fe; color:#0c5a80; }
  .USER_CORRECTED { background:#ede9fe; color:#5b21b6; }
  .tone { font-size:0.7rem; color:var(--soft); }
  .stmt { font-size:1rem; line-height:1.5; }
  .canon { color:var(--soft); font-size:0.8rem; margin-top:0.2rem; }
  .meta { color:var(--soft); font-size:0.72rem; margin-top:0.45rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
  .traj { font-family:ui-monospace,monospace; font-size:0.68rem; color:var(--indigo); }
  .traj.decline { color:#9b3324; }
  button.play { border:1px solid var(--line); background:#fff; border-radius:999px; padding:0.2rem 0.8rem; font-size:0.72rem; cursor:pointer; }
  .empty { color:var(--soft); padding:2rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Memory Inspector</h1>
  <p class="sub">Every fact, graded by how it was given — and traceable to the audio it came from. <b>Why did Yaadein say that? Press play.</b></p>
  <div class="people" id="people"></div>
  <div id="detail"><p class="empty">Select a person.</p></div>
</div>
<script>
const peopleEl = document.getElementById("people");
const detailEl = document.getElementById("detail");

async function load() {
  const people = await (await fetch("/api/people")).json();
  peopleEl.innerHTML = "";
  if (!people.length) { detailEl.innerHTML = '<p class="empty">No people yet — have a conversation first.</p>'; return; }
  people.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "person";
    b.textContent = `${p.name} · ${p.memory_count} memories`;
    b.onclick = () => { document.querySelectorAll(".person").forEach(x => x.classList.remove("active")); b.classList.add("active"); show(p.id); };
    peopleEl.appendChild(b);
    if (i === 0) { b.classList.add("active"); show(p.id); }
  });
}

function trajectory(m) {
  const hist = (m.prov_history || m.provenance).split(",");
  if (hist.length < 2) return "";
  const rank = { USER_ELABORATED: 3, USER_CORRECTED: 3, USER_STATED: 2, USER_CONFIRMED: 1 };
  const declining = rank[hist.at(-1)] < rank[hist[0]];
  return `<span class="traj ${declining ? "decline" : ""}">recall: ${hist.map(h => h.replace("USER_", "")).join(" → ")}${declining ? " ▼ getting harder" : ""}</span>`;
}

async function show(id) {
  const j = await (await fetch(`/api/people/${id}/memories`)).json();
  let html = "";
  if (j.open_loop) html += `<div class="loop">🧵 <b>Open loop:</b> ${j.open_loop.topic} <span class="tone">— will be reopened by name next session</span></div>`;
  if (!j.memories.length) html += '<p class="empty">No memories yet.</p>';
  for (const m of j.memories) {
    html += `<div class="mem">
      <div class="row">
        <span class="chip ${m.provenance}">${m.provenance}</span>
        <span class="tone">${m.category} · ${m.emotional_tone} · visited ${m.visit_count || 0}×</span>
      </div>
      <div class="stmt">${m.statement}</div>
      ${m.canonical ? `<div class="canon">${m.canonical}</div>` : ""}
      <div class="meta">
        <span>${m.created_at}</span>
        ${trajectory(m)}
        ${m.audio_file ? `<button class="play" onclick="new Audio('/api/audio/${m.audio_file}').play()">▶ why did you say that?</button>` : ""}
      </div>
    </div>`;
  }
  detailEl.innerHTML = html;
}
load();
</script>
</body>
</html>
